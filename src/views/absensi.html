<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absensi | DRP Management</title>
    <link rel="stylesheet" href="../css/output.css" />
    <link
      rel="stylesheet"
      href="../../public/assets/fontawesome/css/all.min.css"
    />
    <style>
      :root {
        --blue-primary: oklch(54.6% 0.245 262.881);
      }
      .absensi {
        background-color: var(--blue-primary);
      }

      .icon-absensi {
        color: white;
      }

      .absensi:hover {
        background-color: white;
        color: var(--blue-primary);

        .icon-absensi {
          color: var(--blue-primary);
        }
      }

      .print-btn {
        border-radius: 10%;
        font-size: 1.1rem;
        font-weight: 600;
      }

      .print-btn:hover {
        background-color: rgb(146, 255, 146);
        cursor: pointer;
      }

      .export-button{
        gap: 1rem;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <!-- Sidebar -->
    <div class="sidebar"></div>
    <main
      class="lg:ml-64 ml-0 min-h-screen p-4 transition-all duration-300 main"
    >
      <div class="mb-6 shadow-lg p-6 rounded-xl">
        <h1 class="text-4xl font-bold text-gray-800 mb-2">Absensi</h1>
        <p class="text-gray-600">Daftar kehadiran member gym</p>
      </div>

      <!-- Table Absensi -->
      <div
        class="bg-white shadow-lg rounded-xl border border-gray-200 overflow-hidden"
      >
        <div class="p-6 border-b border-gray-200">
          <div class="flex items-start justify-between">
            <div class="flex items-center">
              <div class="bg-blue-100 p-3 rounded-lg mr-3">
                <i class="fas fa-clipboard-check text-blue-600 text-xl"></i>
              </div>
              <h2 class="text-2xl font-semibold text-gray-800">
                Daftar Absensi
              </h2>
            </div>

            <!-- Filter & Search -->
            <div class="flex items-center gap-3">
              <div class="relative">
                <input
                  type="text"
                  placeholder="Cari nama..."
                  class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                />
                <i
                  class="fas fa-search absolute left-3 top-3 text-gray-400"
                ></i>
              </div>
              <input
                type="date"
                id="filterDate"
                class="border border-gray-300 px-3 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
              />
              <button
                id="btnAll"
                class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg transition font-medium"
              >
                Semua
              </button>
            </div>
          </div>

          <!-- Export Buttons -->
          <div class="export-button flex items-center mt-4">
            <button
              id="btnExportExcel"
              class="bg-green-100 text-green-700 hover:bg-green-600 hover:text-white px-4 py-2 rounded-lg transition font-medium flex items-center gap-2"
            >
              <i class="fas fa-file-excel"></i>
              Export Excel
            </button>
            <button
              id="btnExportPDF"
              class="bg-red-100 text-red-700 hover:bg-red-600 hover:text-white px-4 py-2 rounded-lg transition font-medium flex items-center gap-2"
            >
              <i class="fas fa-file-pdf"></i>
              Export PDF
            </button>
            <span id="filterLabel" class="text-sm text-gray-500 ml-2"></span>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50">
              <tr>
                <th
                  class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider"
                >
                  No
                </th>
                <th
                  class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider"
                >
                  Nama
                </th>
                <th
                  class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider"
                >
                  No Telepon
                </th>
                <th
                  class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider"
                >
                  Tanggal
                </th>
                <th
                  class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider"
                >
                  Jam
                </th>
                <th
                  class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider"
                >
                  Aksi
                </th>
              </tr>
            </thead>
            <tbody id="attendanceTable" class="divide-y divide-gray-200">
              <tr>
                <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                  <i class="fas fa-inbox text-4xl mb-2 block"></i>
                  <p>Memuat data absensi...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </body>

  <script>
    fetch("../components/sidebar.html")
      .then((res) => res.text())
      .then((html) => {
        document.querySelector(".sidebar").innerHTML = html;

        document.getElementById("btn-logout")?.addEventListener("click", () => {
          window.api.exitApp();
        });
      });
  </script>
  <script src="../script/absensi.js"></script>
  <script src="../script/keyboard-reader.js"></script>
</html>
